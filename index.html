<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>תקציב משפחתי</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --primary: #2d6a4f;
  --primary-light: #52b788;
  --primary-dark: #1b4332;
  --accent: #f77f00;
  --accent-light: #ffd166;
  --danger: #e63946;
  --danger-light: #fde8ea;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; }

/* HEADER */
.header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: white;
  padding: 1.5rem 1.2rem 3rem;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: 0; right: 0;
  height: 60px;
  background: var(--bg);
  border-radius: 50% 50% 0 0 / 60px 60px 0 0;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.header h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.month-badge { background: rgba(255,255,255,0.2); padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
.budget-summary { text-align: center; }
.budget-total { font-size: 42px; font-weight: 900; letter-spacing: -2px; margin-bottom: 4px; }
.budget-total span { font-size: 22px; font-weight: 400; opacity: 0.7; }
.budget-sub { font-size: 13px; opacity: 0.75; margin-bottom: 1rem; }
.progress-bar { background: rgba(255,255,255,0.2); border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 6px; }
.progress-fill { height: 100%; border-radius: 10px; background: var(--accent-light); transition: width 0.5s ease; }
.progress-fill.danger { background: var(--danger); }
.progress-labels { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.75; }

/* INCOME CARDS */
.income-row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; padding: 0 1rem; margin-top: -1rem; position: relative; z-index: 1; margin-bottom: 1rem; }
.income-card { background: white; border-radius: 14px; padding: 1rem; box-shadow: var(--shadow); border-top: 3px solid var(--primary-light); }
.income-card .label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.income-card .amount { font-size: 22px; font-weight: 900; color: var(--primary); }
.income-card .edit-btn { font-size: 11px; color: var(--primary-light); background: none; border: none; cursor: pointer; padding: 2px 0; font-weight: 600; }

/* MAIN CONTENT */
.content { padding: 0 1rem 6rem; }

/* SECTION TITLE */
.section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; margin: 1.2rem 0 .6rem; }

/* ADD EXPENSE */
.add-expense-card { background: white; border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.add-expense-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 1rem; color: var(--text); display: flex; align-items: center; gap: .5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .6rem; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea {
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Heebo', sans-serif;
  outline: none;
  background: white;
  color: var(--text);
  direction: rtl;
  transition: border-color .2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45,106,79,.1); }
.add-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Heebo', sans-serif;
  transition: transform .1s, box-shadow .2s;
  box-shadow: 0 4px 14px rgba(45,106,79,.3);
}
.add-btn:active { transform: scale(.98); }

/* CATEGORIES */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-bottom: 1rem; }
.cat-card {
  background: white;
  border-radius: 14px;
  padding: 1rem;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
  border-right: 4px solid;
  position: relative;
  overflow: hidden;
}
.cat-card:active { transform: scale(.97); }
.cat-card .cat-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.cat-card .cat-spent { font-size: 20px; font-weight: 900; }
.cat-card .cat-budget { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.cat-card .cat-bar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.cat-card .cat-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }
.cat-card.over-budget { background: var(--danger-light); }
.cat-card .cat-pct { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.06); border-radius: 8px; padding: 2px 6px; }

/* TRANSACTIONS */
.transaction-item {
  display: flex;
  align-items: center;
  gap: .8rem;
  padding: .9rem 1rem;
  background: white;
  border-radius: 12px;
  margin-bottom: .5rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.tx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 600; color: var(--text); }
.tx-cat { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.tx-amount { font-size: 16px; font-weight: 800; color: var(--danger); white-space: nowrap; }
.tx-date { font-size: 10px; color: var(--text-muted); }
.tx-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 4px; }
.tx-delete:hover { color: var(--danger); }

/* FAB */
.fab { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100; }
.fab button {
  background: linear-gradient(135deg, var(--accent), #f4a261);
  color: white;
  border: none;
  border-radius: 50px;
  padding: 14px 28px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Heebo', sans-serif;
  box-shadow: 0 6px 20px rgba(247,127,0,.4);
  display: flex;
  align-items: center;
  gap: .5rem;
}

/* MODAL */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
.modal.open { display: flex; }
.modal-box { background: white; border-radius: 24px 24px 0 0; padding: 1.5rem; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.modal-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 1.2rem; color: var(--text); }
.modal-close { float: left; background: #f3f4f6; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; color: #888; }
.save-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Heebo', sans-serif;
  margin-top: .8rem;
}

/* TABS */
.tabs { display: flex; gap: 4px; padding: .8rem 1rem .4rem; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { padding: 7px 16px; border-radius: 20px; border: none; background: #e5e7eb; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text-muted); font-family: 'Heebo', sans-serif; transition: all .2s; }
.tab-btn.active { background: var(--primary); color: white; }

/* NOTIF TOAST */
.toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--primary-dark); color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }

/* EMPTY */
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); }
.empty .empty-icon { font-size: 40px; margin-bottom: .7rem; }
.empty p { font-size: 14px; font-weight: 500; }

/* LOADING */
#loading { position: fixed; inset: 0; background: white; z-index: 999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
.spinner { width: 44px; height: 44px; border: 4px solid #e5e7eb; border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* RESET BTN */
.reset-month-btn { width: 100%; padding: 10px; background: #f3f4f6; color: var(--text-muted); border: 1.5px dashed var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Heebo', sans-serif; margin-top: .5rem; }

/* CAT MANAGE */
.cat-manage-item { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; background: var(--bg); border-radius: 10px; margin-bottom: .4rem; }
.cat-manage-item .cat-emoji { font-size: 20px; width: 32px; text-align: center; }
.cat-manage-item .cat-manage-name { flex: 1; font-size: 14px; font-weight: 600; }
.cat-manage-item .cat-manage-budget { font-size: 13px; color: var(--primary); font-weight: 700; }
.cat-manage-item .cat-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; }
.cat-manage-item .cat-del:hover { color: var(--danger); }

@media(min-width: 600px) {
  .cat-grid { grid-template-columns: repeat(3, 1fr); }
  .income-row { max-width: 400px; margin-left: auto; margin-right: auto; }
  .content { max-width: 600px; margin: 0 auto; }
  .header { padding-bottom: 3.5rem; }
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div style="font-size:14px;color:#888;font-weight:600;">טוען...</div></div>
<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <h1>💰 תקציב משפחתי</h1>
    <span class="month-badge" id="month-badge"></span>
  </div>
  <div class="budget-summary">
    <div class="budget-total"><span>₪</span><span id="remaining-amount">0</span></div>
    <div class="budget-sub">נותר מתוך ₪<span id="total-income">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-labels"><span>₪<span id="total-spent">0</span> הוצאות</span><span id="pct-label">0%</span></div>
  </div>
</div>

<!-- INCOME CARDS -->
<div class="income-row">
  <div class="income-card">
    <div class="label">הכנסתי</div>
    <div class="amount">₪<span id="my-income-display">0</span></div>
    <button class="edit-btn" onclick="openIncomeModal('me')">✏️ עריכה</button>
  </div>
  <div class="income-card">
    <div class="label">הכנסת אשתי</div>
    <div class="amount">₪<span id="wife-income-display">0</span></div>
    <button class="edit-btn" onclick="openIncomeModal('wife')">✏️ עריכה</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('overview')">סקירה</button>
  <button class="tab-btn" onclick="switchTab('expenses')">הוצאות</button>
  <button class="tab-btn" onclick="switchTab('history')">היסטוריה</button>
  <button class="tab-btn" onclick="switchTab('settings')">הגדרות</button>
</div>

<div class="content">

  <!-- OVERVIEW TAB -->
  <div id="tab-overview">
    <div class="section-title">הוסף הוצאה</div>
    <div class="add-expense-card">
      <div class="form-row">
        <div class="form-group">
          <label>סכום (₪)</label>
          <input type="number" id="exp-amount" placeholder="0" inputmode="numeric" min="0">
        </div>
        <div class="form-group">
          <label>קטגוריה</label>
          <select id="exp-cat"></select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:.6rem;">
        <label>תיאור (אופציונלי)</label>
        <input type="text" id="exp-desc" placeholder="למשל: סופר, דלק...">
      </div>
      <button class="add-btn" onclick="addExpense()">➕ הוסף הוצאה</button>
    </div>

    <div class="section-title">קטגוריות</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- EXPENSES TAB -->
  <div id="tab-expenses" style="display:none;">
    <div class="section-title">הוצאות החודש</div>
    <div id="expenses-list"></div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" style="display:none;">
    <div class="section-title">חודשים קודמים</div>
    <div id="history-list"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" style="display:none;">
    <div class="section-title">קטגוריות</div>
    <div id="cat-manage-list"></div>
    <button class="add-btn" style="margin-top:.5rem;" onclick="openAddCatModal()">➕ הוסף קטגוריה</button>
    <div class="section-title" style="margin-top:1.2rem;">איפוס</div>
    <button class="reset-month-btn" onclick="resetMonth()">🔄 התחל חודש חדש (שמור היסטוריה)</button>
    <div class="section-title" style="margin-top:1.2rem;">התראות</div>
    <button class="add-btn" style="background:linear-gradient(135deg,#6d28d9,#7c3aed);" onclick="requestNotifPermission()">🔔 הפעל התראות בדפדפן</button>
  </div>

</div>

<!-- MODALS -->
<!-- Income Modal -->
<div class="modal" id="income-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('income-modal')">✕</button>
    <h3 id="income-modal-title">עריכת הכנסה</h3>
    <div class="form-group">
      <label>סכום הכנסה חודשי (₪)</label>
      <input type="number" id="income-input" placeholder="0" inputmode="numeric">
    </div>
    <button class="save-btn" onclick="saveIncome()">שמור</button>
  </div>
</div>

<!-- Add Category Modal -->
<div class="modal" id="add-cat-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('add-cat-modal')">✕</button>
    <h3>הוסף קטגוריה</h3>
    <div class="form-group" style="margin-bottom:.7rem;">
      <label>שם קטגוריה</label>
      <input type="text" id="cat-name-input" placeholder="למשל: מזון, בילויים...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>תקציב חודשי (₪)</label>
        <input type="number" id="cat-budget-input" placeholder="0" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>אמוג'י</label>
        <input type="text" id="cat-emoji-input" placeholder="🛒" maxlength="2">
      </div>
    </div>
    <button class="save-btn" onclick="saveCategory()">שמור קטגוריה</button>
  </div>
</div>

<!-- Category Detail Modal -->
<div class="modal" id="cat-detail-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('cat-detail-modal')">✕</button>
    <h3 id="cat-detail-title"></h3>
    <div id="cat-detail-content"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDyTN8H7FwyhA9wjsEH97fwJB2TGJgEfpA",
  authDomain: "work-system-73906.firebaseapp.com",
  databaseURL: "https://work-system-73906-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "work-system-73906",
  storageBucket: "work-system-73906.firebasestorage.app",
  messagingSenderId: "227399680422",
  appId: "1:227399680422:web:4911726e11a17572b40f67"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Default categories
const DEFAULT_CATS = [
  { id: 'food', name: 'מזון וקניות', emoji: '🛒', budget: 3000, color: '#2d6a4f' },
  { id: 'transport', name: 'תחבורה', emoji: '🚗', budget: 1500, color: '#e76f51' },
  { id: 'housing', name: 'דיור', emoji: '🏠', budget: 4000, color: '#457b9d' },
  { id: 'health', name: 'בריאות', emoji: '💊', budget: 500, color: '#e63946' },
  { id: 'fun', name: 'בילויים', emoji: '🎬', budget: 800, color: '#6d28d9' },
  { id: 'other', name: 'שונות', emoji: '📦', budget: 500, color: '#9ca3af' },
];

let state = {
  income: { me: 0, wife: 0 },
  categories: [],
  expenses: [],
  currentMonth: '',
  editingIncome: null,
};

function getMonthKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

function getMonthLabel(key) {
  if (!key) return '';
  const [y, m] = key.split('-');
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  return `${months[parseInt(m)-1]} ${y}`;
}

async function loadData() {
  const snap = await db.ref('budget').once('value');
  const data = snap.val() || {};
  
  state.currentMonth = getMonthKey();
  state.income = data.income || { me: 0, wife: 0 };
  state.categories = data.categories ? Object.values(data.categories) : DEFAULT_CATS;
  
  // Load this month's expenses
  const monthData = data.months && data.months[state.currentMonth];
  state.expenses = monthData && monthData.expenses ? Object.entries(monthData.expenses).map(([id, e]) => ({...e, id})) : [];
  
  // If no categories saved yet, save defaults
  if (!data.categories) {
    await db.ref('budget/categories').set(Object.fromEntries(DEFAULT_CATS.map(c => [c.id, c])));
  }

  render();
  document.getElementById('loading').style.display = 'none';
}

function render() {
  const totalIncome = state.income.me + state.income.wife;
  const totalSpent = state.expenses.reduce((s, e) => s + e.amount, 0);
  const remaining = totalIncome - totalSpent;
  const pct = totalIncome > 0 ? Math.min(100, Math.round(totalSpent / totalIncome * 100)) : 0;

  document.getElementById('month-badge').textContent = getMonthLabel(state.currentMonth);
  document.getElementById('remaining-amount').textContent = remaining.toLocaleString('he-IL');
  document.getElementById('total-income').textContent = totalIncome.toLocaleString('he-IL');
  document.getElementById('total-spent').textContent = totalSpent.toLocaleString('he-IL');
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('my-income-display').textContent = state.income.me.toLocaleString('he-IL');
  document.getElementById('wife-income-display').textContent = state.income.wife.toLocaleString('he-IL');

  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('danger', pct >= 90);

  renderCategories();
  renderExpenseList();
  renderCatSelect();
  renderCatManage();
  renderHistory();
}

function renderCategories() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  state.categories.forEach(cat => {
    const spent = state.expenses.filter(e => e.catId === cat.id).reduce((s, e) => s + e.amount, 0);
    const pct = cat.budget > 0 ? Math.min(100, Math.round(spent / cat.budget * 100)) : 0;
    const over = spent > cat.budget && cat.budget > 0;
    const card = document.createElement('div');
    card.className = 'cat-card' + (over ? ' over-budget' : '');
    card.style.borderRightColor = cat.color || '#2d6a4f';
    card.innerHTML = `
      <div class="cat-pct">${pct}%</div>
      <div class="cat-name">${cat.emoji || '📦'} ${cat.name}</div>
      <div class="cat-spent" style="color:${over ? 'var(--danger)' : (cat.color || 'var(--primary)')}"}>₪${spent.toLocaleString('he-IL')}</div>
      <div class="cat-budget">מתוך ₪${cat.budget.toLocaleString('he-IL')}</div>
      <div class="cat-bar"><div class="cat-bar-fill" style="width:${pct}%;background:${over ? 'var(--danger)' : (cat.color || 'var(--primary)')}"></div></div>
    `;
    card.onclick = () => openCatDetail(cat);
    grid.appendChild(card);
  });
}

function renderExpenseList() {
  const list = document.getElementById('expenses-list');
  if (!state.expenses.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🧾</div><p>אין הוצאות החודש עדיין</p></div>';
    return;
  }
  const sorted = [...state.expenses].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  list.innerHTML = sorted.map(e => {
    const cat = state.categories.find(c => c.id === e.catId) || { name: 'שונות', emoji: '📦', color: '#9ca3af' };
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="transaction-item">
        <div class="tx-icon" style="background:${cat.color}22">${cat.emoji || '📦'}</div>
        <div class="tx-info">
          <div class="tx-name">${e.desc || cat.name}</div>
          <div class="tx-cat">${cat.name} · <span class="tx-date">${dateStr}</span></div>
        </div>
        <div>
          <div class="tx-amount">-₪${e.amount.toLocaleString('he-IL')}</div>
        </div>
        <button class="tx-delete" onclick="deleteExpense('${e.id}')">✕</button>
      </div>
    `;
  }).join('');
}

function renderCatSelect() {
  const sel = document.getElementById('exp-cat');
  sel.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.emoji || ''} ${c.name}</option>`).join('');
}

function renderCatManage() {
  const list = document.getElementById('cat-manage-list');
  list.innerHTML = state.categories.map(cat => `
    <div class="cat-manage-item">
      <div class="cat-emoji">${cat.emoji || '📦'}</div>
      <div class="cat-manage-name">${cat.name}</div>
      <div class="cat-manage-budget">₪${cat.budget.toLocaleString('he-IL')}/חודש</div>
      <button class="cat-del" onclick="deleteCategory('${cat.id}')">✕</button>
    </div>
  `).join('');
}

async function renderHistory() {
  const snap = await db.ref('budget/months').once('value');
  const months = snap.val() || {};
  const list = document.getElementById('history-list');
  const keys = Object.keys(months).filter(k => k !== state.currentMonth).sort().reverse();
  if (!keys.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><p>אין היסטוריה עדיין</p></div>';
    return;
  }
  list.innerHTML = keys.map(k => {
    const exps = months[k].expenses ? Object.values(months[k].expenses) : [];
    const total = exps.reduce((s, e) => s + e.amount, 0);
    return `
      <div class="transaction-item">
        <div class="tx-icon" style="background:#e5e7eb;">📅</div>
        <div class="tx-info">
          <div class="tx-name">${getMonthLabel(k)}</div>
          <div class="tx-cat">${exps.length} הוצאות</div>
        </div>
        <div class="tx-amount" style="color:var(--text);">₪${total.toLocaleString('he-IL')}</div>
      </div>
    `;
  }).join('');
}

async function addExpense() {
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const catId = document.getElementById('exp-cat').value;
  const desc = document.getElementById('exp-desc').value.trim();
  
  if (!amount || amount <= 0) { showToast('יש להכניס סכום תקין'); return; }
  
  const cat = state.categories.find(c => c.id === catId);
  const expense = { amount, catId, desc, ts: Date.now() };
  
  const ref = db.ref(`budget/months/${state.currentMonth}/expenses`).push();
  await ref.set(expense);
  
  state.expenses.push({ ...expense, id: ref.key });
  
  document.getElementById('exp-amount').value = '';
  document.getElementById('exp-desc').value = '';
  
  // Check budget
  const catSpent = state.expenses.filter(e => e.catId === catId).reduce((s, e) => s + e.amount, 0);
  const catPct = cat && cat.budget > 0 ? catSpent / cat.budget * 100 : 0;
  
  if (cat && catSpent > cat.budget) {
    showToast(`⚠️ חרגת מהתקציב של ${cat.emoji} ${cat.name}! (₪${catSpent.toLocaleString('he-IL')} / ₪${cat.budget.toLocaleString('he-IL')})`);
    sendNotification(`⚠️ חריגת תקציב — ${cat.name}`, `הוצאת ₪${catSpent.toLocaleString('he-IL')} מתוך ₪${cat.budget.toLocaleString('he-IL')}`);
  } else if (cat && catPct >= 80) {
    showToast(`⚠️ ${cat.emoji} ${cat.name}: ${Math.round(catPct)}% מהתקציב נוצל. נותר ₪${(cat.budget - catSpent).toLocaleString('he-IL')}`);
    sendNotification(`⚠️ ${cat.name} — ${Math.round(catPct)}% נוצל`, `נותר ₪${(cat.budget - catSpent).toLocaleString('he-IL')} מתקציב ₪${cat.budget.toLocaleString('he-IL')}`);
  } else {
    showToast(`✅ נרשמה הוצאה של ₪${amount.toLocaleString('he-IL')} ב${cat ? cat.name : ''}`);
    if (cat) sendNotification(`הוצאה נרשמה — ${cat.emoji} ${cat.name}`, `₪${amount.toLocaleString('he-IL')} · נותר ₪${(cat.budget - catSpent).toLocaleString('he-IL')} מהתקציב`);
  }
  
  render();
}

async function deleteExpense(id) {
  if (!confirm('למחוק הוצאה זו?')) return;
  await db.ref(`budget/months/${state.currentMonth}/expenses/${id}`).remove();
  state.expenses = state.expenses.filter(e => e.id !== id);
  render();
}

// Income
let editingWho = null;
function openIncomeModal(who) {
  editingWho = who;
  document.getElementById('income-modal-title').textContent = who === 'me' ? 'הכנסתי החודשית' : 'הכנסת אשתי החודשית';
  document.getElementById('income-input').value = state.income[who] || '';
  document.getElementById('income-modal').classList.add('open');
}
async function saveIncome() {
  const val = parseFloat(document.getElementById('income-input').value) || 0;
  state.income[editingWho] = val;
  await db.ref('budget/income').set(state.income);
  closeModal('income-modal');
  render();
  showToast('✅ הכנסה עודכנה');
}

// Categories
function openAddCatModal() {
  document.getElementById('cat-name-input').value = '';
  document.getElementById('cat-budget-input').value = '';
  document.getElementById('cat-emoji-input').value = '';
  document.getElementById('add-cat-modal').classList.add('open');
}
async function saveCategory() {
  const name = document.getElementById('cat-name-input').value.trim();
  const budget = parseFloat(document.getElementById('cat-budget-input').value) || 0;
  const emoji = document.getElementById('cat-emoji-input').value.trim() || '📦';
  if (!name) { showToast('יש להכניס שם קטגוריה'); return; }
  const colors = ['#2d6a4f','#e76f51','#457b9d','#e63946','#6d28d9','#f77f00','#0077b6','#2a9d8f'];
  const id = 'cat_' + Date.now();
  const cat = { id, name, budget, emoji, color: colors[state.categories.length % colors.length] };
  state.categories.push(cat);
  await db.ref(`budget/categories/${id}`).set(cat);
  closeModal('add-cat-modal');
  render();
  showToast('✅ קטגוריה נוספה');
}
async function deleteCategory(id) {
  if (!confirm('למחוק קטגוריה זו?')) return;
  state.categories = state.categories.filter(c => c.id !== id);
  await db.ref(`budget/categories/${id}`).remove();
  render();
}

// Cat Detail
function openCatDetail(cat) {
  const spent = state.expenses.filter(e => e.catId === cat.id).reduce((s, e) => s + e.amount, 0);
  const remaining = cat.budget - spent;
  const txs = state.expenses.filter(e => e.catId === cat.id).sort((a,b) => (b.ts||0)-(a.ts||0));
  document.getElementById('cat-detail-title').textContent = `${cat.emoji} ${cat.name}`;
  document.getElementById('cat-detail-content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem;text-align:center;">
      <div style="background:var(--bg);border-radius:10px;padding:.8rem;">
        <div style="font-size:18px;font-weight:900;color:var(--danger)">₪${spent.toLocaleString('he-IL')}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:600">הוצאות</div>
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:.8rem;">
        <div style="font-size:18px;font-weight:900;color:var(--primary)">₪${cat.budget.toLocaleString('he-IL')}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:600">תקציב</div>
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:.8rem;">
        <div style="font-size:18px;font-weight:900;color:${remaining < 0 ? 'var(--danger)' : 'var(--primary)'}">₪${Math.abs(remaining).toLocaleString('he-IL')}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:600">${remaining < 0 ? 'חריגה' : 'נותר'}</div>
      </div>
    </div>
    ${txs.length ? txs.map(e => {
      const d = new Date(e.ts);
      return `<div class="transaction-item" style="margin-bottom:.4rem;">
        <div class="tx-icon" style="background:${cat.color}22">${cat.emoji}</div>
        <div class="tx-info"><div class="tx-name">${e.desc || cat.name}</div><div class="tx-cat">${d.toLocaleDateString('he-IL')}</div></div>
        <div class="tx-amount">-₪${e.amount.toLocaleString('he-IL')}</div>
      </div>`;
    }).join('') : '<div class="empty"><div class="empty-icon">🧾</div><p>אין הוצאות בקטגוריה זו</p></div>'}
  `;
  document.getElementById('cat-detail-modal').classList.add('open');
}

// Reset month
async function resetMonth() {
  if (!confirm('להתחיל חודש חדש? הנתונים הנוכחיים יישמרו בהיסטוריה.')) return;
  state.expenses = [];
  state.currentMonth = getMonthKey();
  render();
  showToast('✅ החודש אופס בהצלחה');
}

// Notifications
async function requestNotifPermission() {
  if (!('Notification' in window)) { showToast('הדפדפן לא תומך בהתראות'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') { showToast('✅ התראות הופעלו!'); sendNotification('🔔 התראות פעילות!', 'תקבל התראות על הוצאות וחריגות תקציב'); }
  else showToast('❌ התראות נחסמו — אפשר בהגדרות הדפדפן');
}

function sendNotification(title, body) {
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '💰', dir: 'rtl', lang: 'he' });
  }
}

// UI helpers
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function switchTab(tab) {
  ['overview','expenses','history','settings'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const tabs = ['overview','expenses','history','settings'];
    btn.classList.toggle('active', tabs[i] === tab);
  });
  if (tab === 'history') renderHistory();
}

// Click outside modal to close
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// Init
loadData();
</script>
</body>
</html>
